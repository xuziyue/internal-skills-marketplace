<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Internal Skills Hub</title>
    <style>
      :root {
        --bg: #ecf7ef;
        --bg-2: #d9efdf;
        --panel: #ffffff;
        --ink: #0f2a1d;
        --muted: #3f5f4f;
        --accent: #197a49;
        --accent-2: #0f5a35;
        --chip: #d9f0e2;
        --border: #c8e2d2;
        --terminal: #0d1c14;
        --terminal-ink: #cef2dc;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 20% 0%, var(--bg-2) 0%, transparent 45%),
          radial-gradient(circle at 85% 10%, #e8f7dd 0%, transparent 30%),
          var(--bg);
      }
      .wrap {
        max-width: 1080px;
        margin: 0 auto;
        padding: 24px;
      }
      .hero {
        background: var(--panel);
        border-radius: 20px;
        padding: 24px;
        border: 1px solid var(--border);
        box-shadow: 0 12px 30px rgba(16, 42, 29, 0.08);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 32px;
      }
      .muted { color: var(--muted); }
      .toolbar {
        margin: 16px 0;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      input, select {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        background: #fff;
        min-width: 220px;
      }
      .list {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .card {
        background: var(--panel);
        border-radius: 16px;
        padding: 16px;
        border: 1px solid var(--border);
        box-shadow: 0 8px 20px rgba(16, 42, 29, 0.06);
      }
      .card-row {
        display: grid;
        grid-template-columns: 64px 1fr auto;
        gap: 14px;
        align-items: start;
      }
      .chip {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 12px;
        background: var(--chip);
        margin-right: 6px;
        margin-bottom: 6px;
      }
      .status {
        font-weight: 600;
        font-size: 12px;
        color: var(--accent);
      }
      .logo-wrap {
        width: 52px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .logo-wrap img {
        width: 42px;
        height: 42px;
        display: block;
      }
      .meta {
        margin: 8px 0;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 13px;
      }
      .btn {
        border: 0;
        border-radius: 10px;
        padding: 9px 12px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        font-weight: 600;
      }
      .btn:hover {
        background: var(--accent-2);
      }
      .btn.secondary {
        background: #2d5a44;
      }
      .install-panel {
        margin-top: 14px;
        border-top: 1px dashed #bdd8c9;
        padding-top: 14px;
      }
      .install-panel input {
        min-width: 0;
        width: 100%;
        margin-bottom: 8px;
      }
      .section-title {
        margin: 10px 0 6px;
        font-weight: 700;
        font-size: 13px;
      }
      .terminal {
        background: var(--terminal);
        color: var(--terminal-ink);
        border-radius: 10px;
        border: 1px solid #1b3a2a;
        overflow: hidden;
      }
      .terminal-head {
        padding: 8px 10px;
        font-size: 12px;
        color: #98d3b1;
        border-bottom: 1px solid #1d3a2b;
      }
      .terminal.first-use {
        border-color: #27563f;
      }
      .terminal.first-use .terminal-head {
        background: #123325;
        color: #9fe2bd;
      }
      .terminal.install {
        border-color: #5b4017;
      }
      .terminal.install .terminal-head {
        background: #3d2b10;
        color: #f6d394;
      }
      .terminal.upgrade {
        border-color: #274e63;
      }
      .terminal.upgrade .terminal-head {
        background: #112e3d;
        color: #9fd2f3;
      }
      .terminal-body {
        padding: 10px;
      }
      .cmd-row {
        display: grid;
        grid-template-columns: 14px 1fr;
        gap: 8px;
        align-items: start;
        margin-bottom: 6px;
      }
      .prompt {
        color: #7dd3a7;
      }
      .code-inline {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .snippet {
        background: #102119;
        color: #bff0d4;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #1c3e2d;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      @media (max-width: 600px) {
        .wrap { padding: 14px; }
        .card-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <section class="hero">
        <h1>Internal Skills Hub</h1>
        <p class="muted">Browse and select Copilot skills from this repository.</p>
      </section>
      <div class="toolbar">
        <input id="q" type="search" placeholder="Search skills" />
        <select id="stability">
          <option value="all">All stability</option>
          <option value="stable">stable</option>
          <option value="beta">beta</option>
          <option value="deprecated">deprecated</option>
        </select>
      </div>
      <div id="list" class="list"></div>
    </div>

    <script>
      const list = document.getElementById('list');
      const q = document.getElementById('q');
      const stability = document.getElementById('stability');
      const defaultRepo = 'https://github.com/xuziyue/internal-skills-marketplace.git';
      let skills = [];

      function escapeHtml(text) {
        return String(text)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#39;');
      }

      function logoMarkup(skill) {
        if (skill.slug === 'sql-to-pyspark-converter') {
          return '<div class="logo-wrap"><img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/apachespark.svg" alt="Apache Spark logo" /></div>';
        }
        return '<div class="logo-wrap"><img src="./assets/github-mark.svg" alt="GitHub logo" /></div>';
      }

      function buildFirstUseCommands(repo, path, ref) {
        return [
          `git submodule add ${repo} ${path}`,
          `git -C ${path} checkout ${ref}`,
          `git add .gitmodules ${path}`,
          'git commit -m "Init skills marketplace"'
        ];
      }

      function buildInstallCommands(skill, path) {
        return [
          `cp -R ${path}/skills/${skill.slug} .github/skills/${skill.slug}`,
          `git add .github/skills/${skill.slug}`,
          `git commit -m "Install skill ${skill.slug}@${skill.recommendedVersion}"`
        ];
      }

      function buildUpgradeCommands(skill, path, ref) {
        return [
          `git -C ${path} checkout ${ref}`,
          `git -C ${path} pull`,
          `cp -R ${path}/skills/${skill.slug} .github/skills/${skill.slug}`,
          `git add ${path} .github/skills/${skill.slug}`,
          `git commit -m "Upgrade ${skill.slug} to ${skill.recommendedVersion} (ref: ${ref})"`
        ];
      }

      function buildLockSnippet(skill) {
        return JSON.stringify(
          {
            slug: skill.slug,
            version: skill.recommendedVersion,
            source: `.github/skills/${skill.slug}`
          },
          null,
          2
        );
      }

      async function copyText(text, id) {
        try {
          await navigator.clipboard.writeText(text);
          const el = document.getElementById(id);
          if (el) el.textContent = 'Copied';
          setTimeout(() => {
            const reset = document.getElementById(id);
            if (reset) reset.textContent = '';
          }, 1200);
        } catch {
          const el = document.getElementById(id);
          if (el) el.textContent = 'Copy failed';
        }
      }

      function toggleInstallPanel(slug) {
        const panel = document.getElementById(`install-${slug}`);
        if (!panel) return;
        panel.hidden = !panel.hidden;
      }

      function refreshInstallPreview(skill) {
        const repoEl = document.getElementById(`repo-${skill.slug}`);
        const refEl = document.getElementById(`ref-${skill.slug}`);
        const pathEl = document.getElementById(`path-${skill.slug}`);
        const firstCmdEl = document.getElementById(`first-cmd-${skill.slug}`);
        const installCmdEl = document.getElementById(`install-cmd-${skill.slug}`);
        const upgradeCmdEl = document.getElementById(`upgrade-cmd-${skill.slug}`);
        const lockEl = document.getElementById(`lock-${skill.slug}`);

        if (!repoEl || !refEl || !pathEl || !firstCmdEl || !installCmdEl || !upgradeCmdEl || !lockEl) return;

        const repo = repoEl.value.trim() || defaultRepo;
        const ref = refEl.value.trim() || 'main';
        const targetPath = pathEl.value.trim() || '.github/skills-marketplace';

        const firstUseCommands = buildFirstUseCommands(repo, targetPath, ref);
        const installCommands = buildInstallCommands(skill, targetPath);
        const upgradeCommands = buildUpgradeCommands(skill, targetPath, ref);

        firstCmdEl.innerHTML = firstUseCommands
          .map((cmd) => `<div class="cmd-row"><span class="prompt">$</span><span class="code-inline">${escapeHtml(cmd)}</span></div>`)
          .join('');
        installCmdEl.innerHTML = installCommands
          .map((cmd) => `<div class="cmd-row"><span class="prompt">$</span><span class="code-inline">${escapeHtml(cmd)}</span></div>`)
          .join('');
        upgradeCmdEl.innerHTML = upgradeCommands
          .map((cmd) => `<div class="cmd-row"><span class="prompt">$</span><span class="code-inline">${escapeHtml(cmd)}</span></div>`)
          .join('');
        lockEl.textContent = buildLockSnippet(skill);
      }

      function render() {
        const query = q.value.trim().toLowerCase();
        const s = stability.value;

        const filtered = skills.filter((skill) => {
          const byStability = s === 'all' || skill.stability === s;
          const haystack = [skill.name, skill.slug, skill.summary, ...(skill.tags || [])]
            .join(' ')
            .toLowerCase();
          return byStability && haystack.includes(query);
        });

        list.innerHTML = filtered
          .map((skill) => {
            const tags = (skill.tags || []).map((t) => `<span class="chip">${t}</span>`).join('');
            const panelId = `install-${skill.slug}`;
            const firstCmdId = `first-cmd-${skill.slug}`;
            const installCmdId = `install-cmd-${skill.slug}`;
            const upgradeCmdId = `upgrade-cmd-${skill.slug}`;
            const lockId = `lock-${skill.slug}`;
            const firstCmdStatusId = `first-status-${skill.slug}`;
            const installCmdStatusId = `install-status-${skill.slug}`;
            const upgradeCmdStatusId = `upgrade-status-${skill.slug}`;
            const lockStatusId = `lock-status-${skill.slug}`;
            return `
              <article class="card">
                <div class="card-row">
                  ${logoMarkup(skill)}
                  <div>
                    <div class="status">${skill.stability}</div>
                    <h3>${escapeHtml(skill.name)}</h3>
                    <p class="muted">${escapeHtml(skill.summary)}</p>
                    <div class="meta">
                      <span><strong>Version:</strong> ${skill.version}</span>
                      <span><strong>Recommended:</strong> ${skill.recommendedVersion}</span>
                    </div>
                    <div>${tags}</div>
                  </div>
                  <div>
                    <button class="btn" data-action="toggle-install" data-skill="${skill.slug}">Add as Submodule</button>
                  </div>
                </div>
                <div id="${panelId}" class="install-panel" hidden>
                  <input id="repo-${skill.slug}" value="${defaultRepo}" placeholder="Skills repo URL" />
                  <input id="ref-${skill.slug}" value="main" placeholder="Ref (branch/tag/sha)" />
                  <input id="path-${skill.slug}" value=".github/skills-marketplace" placeholder="Submodule path" />
                  <div class="section-title">First Use</div>
                  <div class="terminal first-use">
                    <div class="terminal-head">Initialize marketplace submodule once</div>
                    <div id="${firstCmdId}" class="terminal-body"></div>
                  </div>
                  <div class="row" style="margin-top: 8px;">
                    <button class="btn secondary" data-action="copy-first" data-skill="${skill.slug}">Copy first-use</button>
                    <span id="${firstCmdStatusId}" class="muted"></span>
                  </div>
                  <div class="section-title">Install This Skill</div>
                  <div class="terminal install">
                    <div class="terminal-head">Install ${skill.slug}</div>
                    <div id="${installCmdId}" class="terminal-body"></div>
                  </div>
                  <div class="row" style="margin-top: 8px;">
                    <button class="btn secondary" data-action="copy-install" data-skill="${skill.slug}">Copy install</button>
                    <span id="${installCmdStatusId}" class="muted"></span>
                  </div>
                  <div class="section-title">Upgrade to This Version</div>
                  <div class="terminal upgrade">
                    <div class="terminal-head">Upgrade ${skill.slug} using selected ref</div>
                    <div id="${upgradeCmdId}" class="terminal-body"></div>
                  </div>
                  <div class="row" style="margin-top: 8px;">
                    <button class="btn secondary" data-action="copy-upgrade" data-skill="${skill.slug}">Copy upgrade</button>
                    <span id="${upgradeCmdStatusId}" class="muted"></span>
                  </div>
                  <div class="section-title">Project lock snippet</div>
                  <pre id="${lockId}" class="snippet"></pre>
                  <div class="row" style="margin-top: 8px;">
                    <button class="btn secondary" data-action="copy-lock" data-skill="${skill.slug}">Copy lock snippet</button>
                    <span id="${lockStatusId}" class="muted"></span>
                  </div>
                </div>
              </article>
            `;
          })
          .join('');

        for (const skill of filtered) {
          const repoEl = document.getElementById(`repo-${skill.slug}`);
          const refEl = document.getElementById(`ref-${skill.slug}`);
          const pathEl = document.getElementById(`path-${skill.slug}`);
          if (repoEl) repoEl.addEventListener('input', () => refreshInstallPreview(skill));
          if (refEl) refEl.addEventListener('input', () => refreshInstallPreview(skill));
          if (pathEl) pathEl.addEventListener('input', () => refreshInstallPreview(skill));
          refreshInstallPreview(skill);
        }
      }

      list.addEventListener('click', async (event) => {
        const target = event.target;
        if (!(target instanceof HTMLElement)) return;
        const action = target.getAttribute('data-action');
        const slug = target.getAttribute('data-skill');
        if (!action || !slug) return;

        const skill = skills.find((x) => x.slug === slug);
        if (!skill) return;

        if (action === 'toggle-install') {
          toggleInstallPanel(slug);
          refreshInstallPreview(skill);
          return;
        }

        if (action === 'copy-first') {
          const repo = (document.getElementById(`repo-${slug}`)?.value || '').trim() || defaultRepo;
          const ref = (document.getElementById(`ref-${slug}`)?.value || '').trim() || 'main';
          const targetPath = (document.getElementById(`path-${slug}`)?.value || '').trim() || '.github/skills-marketplace';
          const lines = buildFirstUseCommands(repo, targetPath, ref).join('\n');
          await copyText(lines, `first-status-${slug}`);
          return;
        }

        if (action === 'copy-install') {
          const targetPath = (document.getElementById(`path-${slug}`)?.value || '').trim() || '.github/skills-marketplace';
          const lines = buildInstallCommands(skill, targetPath).join('\n');
          await copyText(lines, `install-status-${slug}`);
          return;
        }

        if (action === 'copy-upgrade') {
          const ref = (document.getElementById(`ref-${slug}`)?.value || '').trim() || 'main';
          const targetPath = (document.getElementById(`path-${slug}`)?.value || '').trim() || '.github/skills-marketplace';
          const lines = buildUpgradeCommands(skill, targetPath, ref).join('\n');
          await copyText(lines, `upgrade-status-${slug}`);
          return;
        }

        if (action === 'copy-lock') {
          const snippet = buildLockSnippet(skill);
          await copyText(snippet, `lock-status-${slug}`);
        }
      });

      async function load() {
        const res = await fetch('../catalog/index.json');
        const data = await res.json();
        skills = data.skills || [];
        render();
      }

      q.addEventListener('input', render);
      stability.addEventListener('change', render);

      load().catch((err) => {
        list.innerHTML = `<article class="card"><p>Failed to load catalog: ${err.message}</p></article>`;
      });
    </script>
  </body>
</html>
