<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Internal Skills Hub</title>
    <style>
      :root {
        --bg: #f5f7f2;
        --panel: #ffffff;
        --ink: #102018;
        --muted: #4f6356;
        --accent: #196b4d;
        --chip: #d8eadf;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 20% 0%, #dcefd9 0%, transparent 40%),
          radial-gradient(circle at 80% 10%, #fbe8c8 0%, transparent 35%),
          var(--bg);
      }
      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 24px;
      }
      .hero {
        background: var(--panel);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 10px 24px rgba(16, 32, 24, 0.08);
      }
      h1 { margin: 0 0 8px; }
      .muted { color: var(--muted); }
      .toolbar {
        margin: 16px 0;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      input, select {
        border: 1px solid #cfe0d5;
        border-radius: 10px;
        padding: 10px 12px;
        background: #fff;
        min-width: 220px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 14px;
      }
      .card {
        background: var(--panel);
        border-radius: 14px;
        padding: 14px;
        box-shadow: 0 6px 16px rgba(16, 32, 24, 0.08);
      }
      .chip {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 12px;
        background: var(--chip);
        margin-right: 6px;
        margin-bottom: 6px;
      }
      .status {
        font-weight: 600;
        font-size: 12px;
        color: var(--accent);
      }
      @media (max-width: 600px) {
        .wrap { padding: 14px; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <section class="hero">
        <h1>Internal Skills Hub</h1>
        <p class="muted">Browse and select Copilot skills from this repository.</p>
      </section>
      <div class="toolbar">
        <input id="q" type="search" placeholder="Search skills" />
        <select id="stability">
          <option value="all">All stability</option>
          <option value="stable">stable</option>
          <option value="beta">beta</option>
          <option value="deprecated">deprecated</option>
        </select>
      </div>
      <div id="grid" class="grid"></div>
    </div>

    <script>
      const grid = document.getElementById('grid');
      const q = document.getElementById('q');
      const stability = document.getElementById('stability');
      let skills = [];

      function render() {
        const query = q.value.trim().toLowerCase();
        const s = stability.value;

        const filtered = skills.filter((skill) => {
          const byStability = s === 'all' || skill.stability === s;
          const haystack = [skill.name, skill.slug, skill.summary, ...(skill.tags || [])]
            .join(' ')
            .toLowerCase();
          return byStability && haystack.includes(query);
        });

        grid.innerHTML = filtered
          .map((skill) => {
            const tags = (skill.tags || []).map((t) => `<span class="chip">${t}</span>`).join('');
            return `
              <article class="card">
                <div class="status">${skill.stability}</div>
                <h3>${skill.name}</h3>
                <p class="muted">${skill.summary}</p>
                <p><strong>Version:</strong> ${skill.version}</p>
                <p><strong>Recommended:</strong> ${skill.recommendedVersion}</p>
                <p><strong>Min safe:</strong> ${skill.minSafeVersion}</p>
                <div>${tags}</div>
              </article>
            `;
          })
          .join('');
      }

      async function load() {
        const res = await fetch('../catalog/index.json');
        const data = await res.json();
        skills = data.skills || [];
        render();
      }

      q.addEventListener('input', render);
      stability.addEventListener('change', render);

      load().catch((err) => {
        grid.innerHTML = `<article class="card"><p>Failed to load catalog: ${err.message}</p></article>`;
      });
    </script>
  </body>
</html>
