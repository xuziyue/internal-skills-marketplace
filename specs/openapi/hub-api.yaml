openapi: 3.0.3
info:
  title: Internal Skills Hub API
  version: 0.1.0
paths:
  /skills:
    get:
      summary: List skills
      responses:
        '200':
          description: List of skills
  /skills/{slug}:
    get:
      summary: Get skill detail
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Skill detail
        '404':
          description: Not found
  /projects/{projectId}/policy-check:
    post:
      summary: Check project skill versions against policy
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Policy check result
